        <h1>Sample form</h1>
        <hr>
        <!--
        <form action="index.php" method="POST">
        is used irl
        -->
        <form action="index.php" method="POST" enctype="multipart/form-data">
        <!-- enctype for large forms. especially with files -->
            <!-- username -->
            <label for="username">username:</label>
            <input type="text" id="username" placeholder="enter username" maxlength="10" required><br>
            <!-- password -->
            <label for="password">password:</label>
            <input type="password" id="password" placeholder="enter password" required>
            <br>
            <!-- email -->
            <label for="email">email:</label>
            <input type="email" placeholder="example@email.com">
            <br>
            <!-- phone no. -->
            <label for="phone">phone no:</label>
            <input type="tel" id="phone" placeholder="+65 12345678" pattern="[0-9]{2}-[0-9]{8}">
            <br>
            <!-- date -->
            <label for="bday">birthdate:</label>
            <input id="bday" type="date">
            <br>
            <!-- quantity -->
            <label for="quantity">quantity:</label>
            <input id="quantity" type="number" min="0" max="99" value="1">
            <br>
            <!-- radio buttons -->
            <label for="title">title:</label>
            <br>
            <label for="Mr">Mr.</label>
            <input type="radio" id="Mr" name="title">
            <label for="Ms">Ms.</label>
            <input type="radio" id="Ms" name="title">
            <label for="Dr">Dr.</label>
            <input type="radio" id="Dr" name="title">
            <br>
            <!-- Dropdown menu -->
            <label for="payment">Payment method:</label>
            <select>
                <option value="Visa">Visa</option>
                <option value="Mastercard">Mastercard</option>
                <option value="Giftcard">Giftcard</option>
            </select>
            <br>
            <!--Checkbox -->
            <label for="membership">apply for membership:</label>
            <input type="checkbox" id="membership">
            <br>
            <!-- Textbox -->
            <label for="name">Name:</label>
            <input type="text" id="name">
            <br>
            <label for="review">Review:</label>
            <textarea id="review" rows="3" cols="25"></textarea>
            <br>
            <!-- File -->
            <label for="file">attach file:</label>
            <input type="file" id="file" accept="image/png, image/jpeg">
            <br>
            <!-- reset & submit -->
            <input type="reset">
            <input type="submit">
        </form>
